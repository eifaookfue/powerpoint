version: '3.9'
services:
  redis-node1:
    image: redis:7
    container_name: redis-node1
    command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-ip", "192.168.0.150", "--cluster-announce-port", "6379", "--cluster-announce-bus-port 16379"]
    ports:
      - "6379:6379"
      - "16379:16379"
    networks:
      redis-cluster:
        ipv4_address: 10.10.0.101

  redis-node2:
    image: redis:7
    container_name: redis-node2
    command: ["redis-server", "--port", "6380", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-ip", "192.168.0.150", "--cluster-announce-port", "6380", "--cluster-announce-bus-port 16380"]
    ports:
      - "6380:6380"
      - "16380:16380"
    networks:
      redis-cluster:
        ipv4_address: 10.10.0.102

  redis-node3:
    image: redis:7
    container_name: redis-node3
    command: ["redis-server", "--port", "6381", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-ip", "192.168.0.150", "--cluster-announce-port", "6381", "--cluster-announce-bus-port 16381"]
    ports:
      - "6381:6381"
      - "16381:16381"
    networks:
      redis-cluster:
        ipv4_address: 10.10.0.103

  redis-node4:
    image: redis:7
    container_name: redis-node4
    command: ["redis-server", "--port", "6382", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-ip", "192.168.0.150", "--cluster-announce-port", "6382", "--cluster-announce-bus-port 16382"]
    ports:
      - "6382:6382"
      - "16382:16382"
    networks:
      redis-cluster:
        ipv4_address: 10.10.0.104

  redis-node5:
    image: redis:7
    container_name: redis-node5
    command: ["redis-server", "--port", "6383", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-ip", "192.168.0.150", "--cluster-announce-port", "6383", "--cluster-announce-bus-port 16383"]
    ports:
      - "6383:6383"
      - "16383:16383"
    networks:
      redis-cluster:
        ipv4_address: 10.10.0.105

  redis-node6:
    image: redis:7
    container_name: redis-node6
    command: ["redis-server", "--port", "6384", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-ip", "192.168.0.150", "--cluster-announce-port", "6384", "--cluster-announce-bus-port 16384"]
    ports:
      - "6384:6384"
      - "16384:16384"
    networks:
      redis-cluster:
        ipv4_address: 10.10.0.106

networks:
  redis-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
